<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawRide Dispatch Room</title>
<style>
  :root{--bg:#faf8f3;--panel:#fff;--panel-2:#f1efe8;--ink:#1a1815;--muted:#635e56;--line:#e9e5db;--accent:#5e6ad2;--accent-ink:#fff;--r:8px;--sh:0 1px 2px rgba(26,24,21,.05);--ff:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ff)}
  header{padding:18px 22px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent)}
  h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:0;font-weight:650}
  .sub{margin-top:5px;color:var(--muted);max-width:76ch}
  .shell{display:grid;grid-template-columns:minmax(188px,240px) minmax(0,1fr);min-height:calc(100vh - 76px)}
  .rail{border-right:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:14px}
  .nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:var(--r);padding:8px 10px;cursor:pointer;font:inherit}
  .nav button.active{background:var(--accent);color:var(--accent-ink)}
  .state{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel-2);color:var(--muted);font-size:12px}
  .state b{display:block;color:var(--ink);margin-bottom:4px}.state-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
  .wrap{padding:18px;overflow:auto}.stage{position:relative;min-height:680px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);overflow:hidden}
  .stage.layout-board,.stage.layout-map,.stage.layout-room{min-height:720px}
  .frame-head{position:absolute;left:20px;top:18px;z-index:30;max-width:min(620px,calc(100% - 40px))}
  .frame-head h2{font-size:20px;line-height:1.14;margin:0 0 4px}.frame-head p{margin:0;color:var(--muted)}
  .layer{position:absolute;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);padding:12px;overflow:hidden}
  .flow{position:relative;display:inline-block;margin:88px 0 0 20px;vertical-align:top;width:min(320px,calc(100% - 40px))}
  .layer h3{margin:0 0 6px;font-size:15px;line-height:1.2}.layer p{margin:0;color:var(--muted)}
  .kind-label{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:2px 8px;background:var(--panel-2);color:var(--muted);font-size:12px;margin-bottom:7px}
  .kind-hotspot,.kind-button{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--accent);color:var(--accent-ink);border-color:transparent;cursor:pointer;font-weight:650}
  .kind-status.good{border-color:color-mix(in srgb,var(--good,#3d9b6b) 45%,var(--line));background:color-mix(in srgb,var(--good,#3d9b6b) 12%,var(--panel))}
  .kind-status.warn{border-color:color-mix(in srgb,var(--warn,#b87a25) 45%,var(--line));background:color-mix(in srgb,var(--warn,#b87a25) 12%,var(--panel))}
  .kind-person,.kind-entity{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center}
  .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
  .meta{color:var(--muted);font-size:12px}.metric-value{font-size:28px;line-height:1.05;font-weight:700}.metric-delta{color:var(--muted);font-size:12px;margin-top:3px}
  .meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;background:var(--accent);width:0}
  .timeline{display:grid;gap:8px;margin-top:4px}.tl-item{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}.dot{width:10px;height:10px;border-radius:50%;margin:5px 0 0 4px;background:var(--accent)}
  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;height:100%}.col{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:8px;min-height:120px}.col b{display:block;margin-bottom:8px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px;margin-top:6px}
  .map{position:absolute;inset:0;background:linear-gradient(0deg,color-mix(in srgb,var(--panel-2) 70%,transparent),var(--panel));border:0}.pin{position:absolute;transform:translate(-50%,-50%);min-width:116px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:6px 9px;box-shadow:var(--sh);font-size:12px}.route{position:absolute;height:3px;transform-origin:left center;background:var(--accent);border-radius:999px}
  .imagebox{height:100%;display:grid;place-items:center;background:var(--panel-2);color:var(--muted)}
  .actions{position:absolute;right:18px;bottom:18px;z-index:40;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions button,.control select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:8px 10px;font:inherit}
  .actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .control label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.control input[type=range]{width:100%}
  @media(max-width:760px){.shell{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.wrap{padding:10px}.stage{min-height:720px}.layer{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;margin:10px}.frame-head{position:relative;left:auto;top:auto;margin:14px}.flow{display:block;margin:10px;width:auto}}
</style>

<script>
